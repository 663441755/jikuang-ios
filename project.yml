name: Jikuang
options:
  bundleIdPrefix: com.jikuang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Jikuang:
    type: application
    platform: iOS
    sources:
      - path: Jikuang
    dependencies:
      - target: JikuangWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jikuang.devicepulse
        PRODUCT_NAME: Jikuang
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  JikuangWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JikuangWidget
      - path: Jikuang/Core/PowerSource.swift
      - path: Jikuang/Core/DeviceInfo.swift
      - path: Jikuang/Core/NetSpeed.swift
      - path: Jikuang/Core/ChargeActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jikuang.devicepulse.widget
        PRODUCT_NAME: JikuangWidget
        INFOPLIST_FILE: JikuangWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -DJIKUANG_WIDGET"

schemes:
  Jikuang:
    build:
      targets:
        Jikuang: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
