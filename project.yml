name: Jikuang
options:
  bundleIdPrefix: com.jikuang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Jikuang:
    type: application
    platform: iOS
    sources:
      - path: Jikuang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jikuang.devicepulse
        PRODUCT_NAME: Jikuang
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 机况
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: 用于陀螺仪、加速度计、磁力计与气压计的硬件检测
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于麦克风录音电平检测
        INFOPLIST_KEY_NSCameraUsageDescription: 用于前后摄像头枚举与对焦检测
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于 GPS 与海拔检测
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Jikuang:
    build:
      targets:
        Jikuang: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
