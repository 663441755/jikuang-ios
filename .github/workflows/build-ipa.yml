name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Jikuang.xcodeproj \
            -scheme Jikuang \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 120

      - name: Package into IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Jikuang.app"
          echo "--- product tree ---"
          ls -la "$APP_PATH"
          rm -rf Payload Jikuang.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Jikuang.ipa Payload
          ls -lh Jikuang.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jikuang-ipa
          path: Jikuang.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs
          if-no-files-found: ignore
          retention-days: 7
