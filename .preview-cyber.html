<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Silkscreen";src:url("file:///F:/IPhone状态APP/Jikuang/Resources/Fonts/Silkscreen-Regular.ttf");font-weight:400}
@font-face{font-family:"Silkscreen";src:url("file:///F:/IPhone状态APP/Jikuang/Resources/Fonts/Silkscreen-Bold.ttf");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060A;width:393px;height:852px;overflow:hidden;position:relative;
  font-family:"Silkscreen",monospace;-webkit-font-smoothing:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#00F0FF 1px,transparent 1px);
  background-size:16px 16px;opacity:.11}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% -2%,rgba(0,240,255,.10),transparent 440px)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 4px);opacity:.55}
.wrap{position:relative;padding:52px 16px 0}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hb{width:5px;height:17px;background:#00F0FF;box-shadow:0 0 6px #00F0FF}
.ht{font-family:"PingFang SC",sans-serif;font-weight:900;font-size:22px;color:#DFFBFF;letter-spacing:.6px}
.hs{margin-left:auto;font-size:9px;color:#4A5C70}
.card{background:#0B1018;border:1px solid rgba(0,240,255,.16);position:relative;padding:14px;margin-bottom:10px;
  background-image:linear-gradient(135deg,rgba(0,240,255,.045),transparent 55%)}
.cor{position:absolute;inset:0;pointer-events:none}
.cor i{position:absolute;width:9px;height:9px;border-color:rgba(0,240,255,.42);border-style:solid;border-width:0}
.cor i:nth-child(1){top:0;left:0;border-top-width:1.2px;border-left-width:1.2px}
.cor i:nth-child(2){top:0;right:0;border-top-width:1.2px;border-right-width:1.2px}
.cor i:nth-child(3){bottom:0;left:0;border-bottom-width:1.2px;border-left-width:1.2px}
.cor i:nth-child(4){bottom:0;right:0;border-bottom-width:1.2px;border-right-width:1.2px}
.row{display:flex;align-items:center;gap:8px}
.live{width:6px;height:6px;background:#39FF14;box-shadow:0 0 5px #39FF14}
.st{font-weight:700;font-size:10px;color:#39FF14;letter-spacing:.5px}
.ch{margin-left:auto;font-size:8px;color:#4A5C70}
.src{font-size:8px;color:rgba(0,240,255,.8);border:1px solid rgba(0,240,255,.35);padding:1.5px 4px}
.pw{display:flex;align-items:flex-end;margin-top:12px}
.big{font-weight:700;font-size:50px;color:#DFFBFF;text-shadow:0 0 10px rgba(0,240,255,.45);line-height:.9}
.unit{font-weight:700;font-size:14px;color:#00F0FF;margin-left:3px;margin-bottom:6px}
.bpm{margin-left:auto;text-align:right}
.bpmv{font-weight:700;font-size:19px;color:#39FF14}
.bpmu{font-size:7.5px;color:#4A5C70;margin-left:2px}
.proto{font-family:"PingFang SC",sans-serif;font-size:8.5px;color:#4A5C70;margin-top:2px}
.ecg{margin-top:12px;border:1px solid rgba(0,240,255,.16);position:relative;height:168px}
canvas{display:block}
.params{display:flex;margin-top:12px;padding-top:2px}
.pm{flex:1}
.pl{font-size:7px;color:#4A5C70;letter-spacing:.5px}
.pv{font-weight:700;font-size:15px;margin-top:3px}
.pu{font-size:8px;color:#4A5C70;margin-left:2px;font-weight:400}
.ful{display:flex;align-items:center;margin-top:12px;font-family:"PingFang SC",sans-serif;font-size:9.5px;color:#4A5C70}
.est{font-family:"Silkscreen";font-size:7.5px;border:1px solid rgba(74,92,112,.4);padding:1px 4px;margin-left:6px}
.fv{margin-left:auto;font-family:"Silkscreen";font-weight:700;font-size:13px;color:#DFFBFF}
.tab{position:absolute;bottom:0;left:0;right:0;height:76px;background:#06080D;border-top:1px solid rgba(0,240,255,.28);display:flex}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#4A5C70}
.tb.on{color:#00F0FF;background:rgba(0,240,255,.09);border-top:2px solid #00F0FF;box-shadow:inset 0 1px 0 rgba(0,240,255,.4)}
.tb span{font-family:"PingFang SC";font-size:8.5px;font-weight:600;letter-spacing:.6px}
.tb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
</style></head><body>
<div class="dots"></div><div class="glow"></div><div class="scan"></div>
<div class="wrap">
  <div class="hd"><div class="hb"></div><div class="ht">充电</div><div class="hs">ECG MODE</div></div>

  <div class="card">
    <div class="cor"><i></i><i></i><i></i><i></i></div>
    <div class="row">
      <div class="live"></div><div class="st">CHARGING</div>
      <div class="ch">CH-1</div><div class="src">1% 精度</div>
    </div>
    <div class="pw">
      <div class="big">45.2</div><div class="unit">W</div>
      <div class="bpm"><span class="bpmv">93</span><span class="bpmu">BPM</span>
        <div class="proto">PD 3.1 AVS · EPR 高功率档</div></div>
    </div>
    <div class="ecg"><canvas id="c" width="660" height="336" style="width:330px;height:168px"></canvas></div>
    <div class="params">
      <div class="pm"><div class="pl">VOLTAGE</div><div class="pv" style="color:#00F0FF">20.0<span class="pu">V</span></div></div>
      <div class="pm"><div class="pl">CURRENT</div><div class="pv" style="color:#B14AF7">2.26<span class="pu">A</span></div></div>
      <div class="pm"><div class="pl">BATTERY</div><div class="pv" style="color:#FF2E97">39.3<span class="pu">W</span></div></div>
    </div>
    <div class="ful">预计充满<span class="est">EST</span><span class="fv">28 <span style="font-size:7.5px;color:#4A5C70">MIN</span></span></div>
  </div>

  <div class="card">
    <div class="cor"><i></i><i></i><i></i><i></i></div>
    <div style="display:flex">
      <div class="pm"><div class="pl">本次时长</div><div class="pv" style="color:#DFFBFF">26:12</div></div>
      <div class="pm"><div class="pl">峰值功率</div><div class="pv" style="color:#00F0FF">45.2<span class="pu">W</span></div></div>
      <div class="pm"><div class="pl">充入能量</div><div class="pv" style="color:#39FF14">18.4<span class="pu">Wh</span></div></div>
    </div>
  </div>
</div>

<div class="tab">
  <div class="tb"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 19h4"/></svg><span>概览</span></div>
  <div class="tb on"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg><span>充电</span></div>
  <div class="tb"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5"/></svg><span>监控</span></div>
  <div class="tb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>小组件</span></div>
  <div class="tb"><svg viewBox="0 0 24 24"><path d="M14 6l4 4-9 9H5v-4l9-9z"/></svg><span>工具</span></div>
</div>

<script>
// 与 Swift 端 ChargeEstimator.ecgWave 完全同参数
function ecgWave(p){
  const g=(c,w)=>{const d=(p-c)/w;return Math.exp(-d*d)};
  return 0.13*g(0.150,0.030) - 0.10*g(0.252,0.009) + 1.00*g(0.272,0.011)
       - 0.26*g(0.294,0.013) + 0.26*g(0.430,0.050);
}
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height, N=72;
const baseY=H*0.66, ampPx=H*0.52;

// 网格纸
ctx.lineWidth=1;
ctx.strokeStyle='rgba(0,240,255,0.10)';
for(let x=0;x<=W;x+=14){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
for(let y=0;y<=H;y+=14){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.strokeStyle='rgba(0,240,255,0.15)';
for(let x=0;x<=W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
for(let y=0;y<=H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

// 基线
ctx.strokeStyle='rgba(0,240,255,0.18)';ctx.beginPath();ctx.moveTo(0,baseY);ctx.lineTo(W,baseY);ctx.stroke();

// 生成波形：45W -> ratio .9 -> amp .93，周期 60/98
const ratio=0.9, amp=0.30+0.70*ratio, period=60/(66+30*ratio);
let pts=[];
for(let i=0;i<N;i++){
  const p=((i*0.06)/period)%1;
  let v=ecgWave(p)*amp + (Math.random()*2-1)*0.006;
  pts.push(v);
}
// 台阶折线
function trace(){
  ctx.beginPath();
  const stepX=W/(N-1);
  let lastY=baseY;
  pts.forEach((v,i)=>{
    const x=i*stepX;
    const y=Math.max(2,Math.min(baseY- v*ampPx, baseY+ampPx*0.35));
    if(i===0)ctx.moveTo(x,y);
    else{ctx.lineTo(x,lastY);ctx.lineTo(x,y);}
    lastY=y;
  });
}
// 辉光
trace();ctx.strokeStyle='rgba(57,255,20,0.22)';ctx.lineWidth=6;ctx.lineJoin='miter';ctx.stroke();
// 主线
trace();ctx.strokeStyle='#39FF14';ctx.lineWidth=1.8;ctx.stroke();
// 扫描头
const lx=W-1, ly=Math.max(2,Math.min(baseY-pts[N-1]*ampPx,baseY+ampPx*0.35));
ctx.fillStyle='#39FF14';ctx.fillRect(lx-3,ly-3,6,6);
</script>
</body></html>
